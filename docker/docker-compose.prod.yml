version: '3.8'

services:
  postgres:
    image: postgres:17-alpine
    container_name: samud-postgres-prod
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-samud_shabkat}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_prod_pass_123}
    ports:
      - "5432:5432"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-samud_shabkat}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - samud-network

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: samud-api-prod
    restart: always
    environment:
      NODE_ENV: production
      PORT: 4000
      HOST: 0.0.0.0
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_prod_pass_123}@postgres:5432/${POSTGRES_DB:-samud_shabkat}
      JWT_SECRET: ${JWT_SECRET:-super_secret_production_jwt_key_2026}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-samud-shabkat-media}
      R2_PUBLIC_DOMAIN: ${R2_PUBLIC_DOMAIN}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM:-orders@samudshabkat.com}
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - samud-network

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    container_name: samud-web-prod
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://samudshabkat.com/api/v1}
    ports:
      - "3000:3000"
    depends_on:
      - api
    networks:
      - samud-network

  nginx:
    image: nginx:alpine
    container_name: samud-nginx-prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_etc:/etc/letsencrypt
      - certbot_var:/var/lib/letsencrypt
      - webroot:/var/www/certbot
    depends_on:
      - web
      - api
    networks:
      - samud-network

  certbot:
    image: certbot/certbot
    container_name: samud-certbot
    volumes:
      - certbot_etc:/etc/letsencrypt
      - certbot_var:/var/lib/letsencrypt
      - webroot:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - samud-network

volumes:
  postgres_prod_data:
  certbot_etc:
  certbot_var:
  webroot:

networks:
  samud-network:
    driver: bridge
