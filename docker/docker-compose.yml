services:
  postgres:
    image: postgres:17
    container_name: samud-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-samud_shabkat}
      POSTGRES_USER: ${DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
      - ./postgres/backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d samud_shabkat"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - samud-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: samud-pgadmin
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@samud.local
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: "False"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - samud-network

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    networks:
      - samud-network

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    environment:
      API_PORT: 4000
      DATABASE_URL: "${DATABASE_URL:-postgres://postgres:postgres@postgres:5432/samud_shabkat}"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - samud-network

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - api
    networks:
      - samud-network

networks:
  samud-network:
    driver: bridge

volumes:
  postgres_data:
  pgadmin_data:
