services:
  web:
    build: { context: .., dockerfile: docker/Dockerfile.web }
  api:
    build: { context: .., dockerfile: docker/Dockerfile.api }
    environment: { API_PORT: 4000, DATABASE_URL: "${DATABASE_URL}" }
  nginx:
    image: nginx:1.27-alpine
    ports: ["80:80"]
    volumes: ["./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on: [web, api]
